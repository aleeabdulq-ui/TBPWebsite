# Include inside the server { } block for thebuildingpractice.com.
#
# Create the password file first (do not commit it):
#   htpasswd -c /etc/nginx/.htpasswd-tbp-admin admin

location ~ ^/pages/(admin-.*|blog-login)\.html$ {
    auth_basic           "TBP Admin";
    auth_basic_user_file /etc/nginx/.htpasswd-tbp-admin;

    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Cache-Control "no-store" always;
    add_header X-Frame-Options "DENY" always;

    try_files $uri =404;
}

# Block the admin JSON/data endpoints too, if they are served statically.
location ~ ^/data/.*admin.*\.json$ {
    auth_basic           "TBP Admin";
    auth_basic_user_file /etc/nginx/.htpasswd-tbp-admin;
}
