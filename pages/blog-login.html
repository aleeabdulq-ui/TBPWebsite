<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <script src="../js/theme-head.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <title>Blog Admin Login | The Building Practice Ltd.</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="vendor/boxicons.min.css" rel="stylesheet" />

  <style>
    :root {
      color-scheme: light;
      --primary: #00ACC1;
      --primary-light: #26C6DA;
      --primary-dark: #00838F;
      --white: #FFFFFF;
      --gray-50: #F8FAFC;
      --gray-100: #F1F5F9;
      --gray-200: #E2E8F0;
      --gray-300: #CBD5E1;
      --gray-400: #94A3B8;
      --gray-500: #64748B;
      --gray-600: #475569;
      --gray-700: #334155;
      --gray-800: #1E293B;
      --gray-900: #0F172A;
      --success: #10B981;
      --warning: #F59E0B;
      --danger: #EF4444;
      --info: #6366F1;
      --font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --bg: var(--white);
      --bg-secondary: var(--gray-50);
      --surface: var(--white);
      --text-primary: var(--gray-900);
      --text-secondary: var(--gray-600);
      --text-tertiary: var(--gray-500);
      --border: var(--gray-200);
      --radius-md: 12px;
      --shadow-md: 0 4px 6px -1px rgba(15, 23, 42, 0.08), 0 2px 4px -1px rgba(15, 23, 42, 0.04);
    }

    html[data-theme="dark"],
    body[data-theme="dark"] {
      color-scheme: dark;
      --bg: #0C0F14;
      --bg-secondary: #0F141C;
      --surface: #111826;
      --text-primary: #F8FAFC;
      --text-secondary: #CBD5E1;
      --text-tertiary: #64748B;
      --border: rgba(148, 163, 184, 0.14);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
    }

    body {
      font-family: var(--font-family);
      background: linear-gradient(135deg, var(--bg) 0%, var(--bg-secondary) 100%);
      color: var(--text-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .login-container {
      width: 100%;
      max-width: 420px;
    }

    .login-card {
      background: var(--surface);
      border-radius: var(--radius-md);
      padding: 40px;
      box-shadow: var(--shadow-md);
      border: 1px solid var(--border);
    }

    .login-header {
      text-align: center;
      margin-bottom: 32px;
    }

    .login-logo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 20px;
      color: var(--primary);
      font-size: 24px;
      font-weight: 700;
    }

    .login-logo i {
      font-size: 32px;
    }

    .login-title {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 8px;
      color: var(--text-primary);
    }

    .login-subtitle {
      font-size: 14px;
      color: var(--text-secondary);
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 8px;
      color: var(--text-primary);
    }

    .form-input {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-family: var(--font-family);
      font-size: 14px;
      background: var(--bg);
      color: var(--text-primary);
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .form-input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(0, 172, 193, 0.1);
    }

    .form-input::placeholder {
      color: var(--text-tertiary);
    }

    .form-remember {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 24px;
      font-size: 14px;
      color: var(--text-secondary);
    }

    .form-checkbox {
      width: 18px;
      height: 18px;
      cursor: pointer;
      accent-color: var(--primary);
    }

    .form-button {
      width: 100%;
      padding: 12px 16px;
      background: var(--primary);
      color: var(--white);
      border: none;
      border-radius: 8px;
      font-family: var(--font-family);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .form-button:hover {
      background: var(--primary-dark);
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(0, 172, 193, 0.3);
    }

    .form-button:active {
      transform: translateY(0);
    }

    .form-button.loading {
      opacity: 0.8;
      pointer-events: none;
    }

    .error-message {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: var(--danger);
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 14px;
      margin-bottom: 20px;
      display: none;
    }

    .error-message.show {
      display: block;
    }

    .login-footer {
      text-align: center;
      margin-top: 24px;
      font-size: 14px;
      color: var(--text-secondary);
    }

    .theme-toggle {
      position: fixed;
      top: 20px;
      right: 20px;
      display: flex;
      gap: 8px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 4px;
    }

    .theme-btn {
      width: 36px;
      height: 36px;
      border: none;
      background: transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
      color: var(--text-secondary);
      transition: all 0.2s;
      font-size: 18px;
    }

    .theme-btn.active {
      background: var(--primary);
      color: var(--white);
    }

    .theme-btn:hover {
      color: var(--primary);
    }

    @media (max-width: 520px) {
      .login-card {
        padding: 24px;
      }

      .login-title {
        font-size: 20px;
      }

      .theme-toggle {
        top: 16px;
        right: 16px;
      }
    }
  </style>
</head>
<body>
  <div class="theme-toggle">
    <button class="theme-btn active" data-theme="light" title="Light mode">
      <i class="bx bx-sun"></i>
    </button>
    <button class="theme-btn" data-theme="dark" title="Dark mode">
      <i class="bx bx-moon"></i>
    </button>
  </div>

  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <div class="login-logo">
          <i class="bx bxs-lock-alt"></i>
          <span>Blog Admin</span>
        </div>
        <h1 class="login-title">Welcome Back</h1>
        <p class="login-subtitle">Sign in to manage your blog posts</p>
      </div>

      <div class="error-message" id="errorMessage"></div>

      <form id="loginForm">
        <div class="form-group">
          <label class="form-label" for="email">Email Address</label>
          <input
            type="email"
            id="email"
            class="form-input"
            placeholder="admin@thebuilding.practice"
            required
          />
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input
            type="password"
            id="password"
            class="form-input"
            placeholder="Enter your password"
            required
          />
        </div>

        <div class="form-remember">
          <input type="checkbox" id="remember" class="form-checkbox" />
          <label for="remember">Remember me</label>
        </div>

        <button type="submit" class="form-button">
          <i class="bx bx-lock-open"></i>
          <span>Sign In</span>
        </button>
      </form>

      <div class="login-footer">
        Demo credentials: admin@thebuilding.practice / password123
      </div>
    </div>
  </div>

  <script>
    // Clear old authentication on page load so the admin gear always shows sign-in first.
    localStorage.removeItem('blog-auth');
    
    (function () {
      const form = document.getElementById('loginForm');
      const emailInput = document.getElementById('email');
      const passwordInput = document.getElementById('password');
      const rememberCheckbox = document.getElementById('remember');
      const errorMessage = document.getElementById('errorMessage');
      const themeButtons = document.querySelectorAll('.theme-btn');
      const html = document.documentElement;

      // Theme handling
      const currentTheme = localStorage.getItem('blog-theme') || 'light';
      html.setAttribute('data-theme', currentTheme);
      updateThemeButtons(currentTheme);

      themeButtons.forEach((btn) => {
        btn.addEventListener('click', () => {
          const theme = btn.getAttribute('data-theme');
          html.setAttribute('data-theme', theme);
          localStorage.setItem('blog-theme', theme);
          updateThemeButtons(theme);
        });
      });

      function updateThemeButtons(theme) {
        themeButtons.forEach((btn) => {
          btn.classList.toggle('active', btn.getAttribute('data-theme') === theme);
        });
      }

      // Load saved email if "Remember me" was checked
      const savedEmail = localStorage.getItem('blog-email');
      if (savedEmail) {
        emailInput.value = savedEmail;
        rememberCheckbox.checked = true;
      }

      // Form submission
      form.addEventListener('submit', (e) => {
        e.preventDefault();
        errorMessage.classList.remove('show');

        const email = emailInput.value.trim();
        const password = passwordInput.value;

        // Demo credentials check
        if (email === 'admin@thebuilding.practice' && password === 'password123') {
          // Set authentication
          localStorage.setItem('blog-auth', JSON.stringify({
            email: email,
            loginTime: new Date().toISOString(),
            sessionId: Math.random().toString(36).substring(7)
          }));

          // Save email if remember me is checked
          if (rememberCheckbox.checked) {
            localStorage.setItem('blog-email', email);
          } else {
            localStorage.removeItem('blog-email');
          }

          // Redirect to blog admin
          window.location.href = 'admin-blog.html';
        } else {
          // Show error
          errorMessage.textContent = 'Invalid email or password. Try admin@thebuilding.practice / password123';
          errorMessage.classList.add('show');
          passwordInput.value = '';
          passwordInput.focus();
        }
      });

      // Allow enter key to submit
      passwordInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
          form.dispatchEvent(new Event('submit'));
        }
      });
    })();
  </script>
  <script src="../js/theme-sync.js" defer></script>
</body>
</html>
