<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <script src="../js/theme-head.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Post | The Building Practice Ltd.</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="vendor/boxicons.min.css" rel="stylesheet">
    
    <style>
        :root {
            --primary: #00ACC1;
            --primary-light: #26C6DA;
            --primary-dark: #00838F;
            --gradient-start: #00ACC1;
            --gradient-mid: #7C4DFF;
            --gradient-end: #E040FB;
            --white: #FFFFFF;
            --gray-50: #F9FAFB;
            --gray-100: #F3F4F6;
            --gray-200: #E5E7EB;
            --gray-300: #D1D5DB;
            --gray-400: #9CA3AF;
            --gray-500: #6B7280;
            --gray-600: #4B5563;
            --gray-700: #374151;
            --gray-800: #1F2937;
            --gray-900: #111827;
            --bg-primary: var(--white);
            --bg-secondary: var(--gray-50);
            --bg-tertiary: var(--gray-100);
            --text-primary: var(--gray-900);
            --text-secondary: var(--gray-600);
            --text-tertiary: var(--gray-400);
            --border-primary: var(--gray-200);
            --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
            --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.1);
            --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.1);
            --radius-md: 8px;
            --radius-lg: 12px;
            --radius-xl: 16px;
            --radius-2xl: 24px;
            --radius-full: 9999px;
            --space-1: 4px;
            --space-2: 8px;
            --space-3: 12px;
            --space-4: 16px;
            --space-5: 20px;
            --space-6: 24px;
            --space-8: 32px;
            --space-10: 40px;
            --space-12: 48px;
            --space-16: 64px;
            --space-20: 80px;
            --font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            --text-xs: 12px;
            --text-sm: 14px;
            --text-base: 16px;
            --text-lg: 18px;
            --text-xl: 20px;
            --text-2xl: 24px;
            --text-3xl: 30px;
            --text-4xl: 36px;
            --text-5xl: 48px;
        }

        [data-theme="dark"] {
            --bg-primary: var(--gray-900);
            --bg-secondary: var(--gray-800);
            --bg-tertiary: var(--gray-700);
            --text-primary: var(--white);
            --text-secondary: var(--gray-300);
            --text-tertiary: var(--gray-500);
            --border-primary: var(--gray-700);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        
        body {
            font-family: var(--font-family);
            font-size: var(--text-base);
            line-height: 1.6;
            color: var(--text-primary);
            background: var(--bg-primary);
            -webkit-font-smoothing: antialiased;
            display: grid;
            grid-template-columns: 280px 1fr 320px;
            gap: var(--space-8);
            min-height: 100vh;
            padding: var(--space-6);
        }

        a { color: inherit; text-decoration: none; }
        img { max-width: 100%; height: auto; display: block; }
        button { font-family: inherit; cursor: pointer; border: none; background: none; padding: 0; }

        /* ========== SIDEBAR LEFT ========== */
        .sidebar-left {
            position: sticky;
            top: var(--space-6);
            height: max-content;
            border-right: 1px solid var(--border-primary);
            padding-right: var(--space-6);
            max-height: calc(100vh - var(--space-12));
            overflow-y: auto;
        }

        .sidebar-left::-webkit-scrollbar { width: 6px; }
        .sidebar-left::-webkit-scrollbar-thumb { background: var(--gray-300); border-radius: 3px; }

        .sidebar-logo {
            display: flex;
            align-items: center;
            gap: var(--space-2);
            margin-bottom: var(--space-8);
            font-weight: 800;
            font-size: var(--text-base);
        }

        .sidebar-logo i {
            font-size: 20px;
            color: var(--primary);
        }

        .sidebar-nav {
            display: flex;
            flex-direction: column;
            gap: var(--space-2);
            margin-bottom: var(--space-8);
        }

        .sidebar-nav-item {
            display: flex;
            align-items: center;
            gap: var(--space-3);
            padding: var(--space-3) var(--space-4);
            border-radius: var(--radius-lg);
            color: var(--text-secondary);
            font-size: var(--text-sm);
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .sidebar-nav-item:hover, .sidebar-nav-item.active {
            background: var(--bg-secondary);
            color: var(--primary);
            font-weight: 600;
        }

        .sidebar-nav-item i { font-size: 18px; }

        .sidebar-section {
            margin-bottom: var(--space-8);
        }

        .sidebar-section-title {
            font-size: var(--text-xs);
            font-weight: 700;
            text-transform: uppercase;
            color: var(--text-tertiary);
            padding: var(--space-3) var(--space-4);
            margin-bottom: var(--space-3);
            letter-spacing: 0.5px;
        }

        .category-item {
            padding: var(--space-2) var(--space-4);
            border-radius: var(--radius-md);
            font-size: var(--text-sm);
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .category-item:hover {
            background: var(--bg-secondary);
            color: var(--primary);
            padding-left: var(--space-5);
        }

        /* ========== MAIN CONTENT ========== */
        .content-main {
            display: flex;
            flex-direction: column;
            gap: var(--space-6);
        }

        .breadcrumb {
            display: flex;
            align-items: center;
            gap: var(--space-2);
            font-size: var(--text-sm);
            color: var(--text-secondary);
        }

        .breadcrumb a {
            color: var(--primary);
            transition: color 0.2s ease;
        }

        .breadcrumb a:hover { color: var(--primary-dark); }

        .post-header {
            display: flex;
            align-items: center;
            gap: var(--space-3);
            margin-bottom: var(--space-4);
        }

        .post-author-avatar {
            width: 48px;
            height: 48px;
            border-radius: var(--radius-full);
            background: linear-gradient(135deg, var(--gradient-start), var(--gradient-mid));
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 700;
            flex-shrink: 0;
        }

        .post-author-meta {
            display: flex;
            flex-direction: column;
            gap: var(--space-1);
        }

        .post-author-name {
            font-weight: 600;
            color: var(--text-primary);
            font-size: var(--text-sm);
        }

        .post-publish-date {
            font-size: var(--text-xs);
            color: var(--text-tertiary);
        }

        .post-title {
            font-size: var(--text-4xl);
            font-weight: 800;
            line-height: 1.2;
            margin-bottom: var(--space-5);
            color: var(--text-primary);
        }

        .post-meta-line {
            display: flex;
            align-items: center;
            gap: var(--space-4);
            margin-bottom: var(--space-6);
            font-size: var(--text-sm);
            color: var(--text-secondary);
            padding-bottom: var(--space-5);
            border-bottom: 1px solid var(--border-primary);
            flex-wrap: wrap;
        }

        .post-meta-item {
            display: flex;
            align-items: center;
            gap: var(--space-2);
        }

        .post-meta-item i { font-size: 16px; }

        .post-category-badge {
            display: inline-block;
            padding: var(--space-2) var(--space-3);
            background: var(--bg-secondary);
            border-radius: var(--radius-full);
            font-size: var(--text-xs);
            font-weight: 600;
            text-transform: capitalize;
            color: var(--primary);
        }

        .post-hero-image {
            width: 100%;
            height: 400px;
            object-fit: cover;
            border-radius: var(--radius-xl);
            margin-bottom: var(--space-8);
            box-shadow: var(--shadow-lg);
        }

        .post-body {
            font-size: var(--text-lg);
            line-height: 1.8;
            color: var(--text-secondary);
            margin-bottom: var(--space-12);
        }

        .post-body h2 {
            font-size: var(--text-3xl);
            font-weight: 700;
            color: var(--text-primary);
            margin: var(--space-8) 0 var(--space-4) 0;
        }

        .post-body h3 {
            font-size: var(--text-2xl);
            font-weight: 700;
            color: var(--text-primary);
            margin: var(--space-6) 0 var(--space-3) 0;
        }

        .post-body p {
            margin-bottom: var(--space-6);
        }

        .post-body ul, .post-body ol {
            margin: var(--space-6) 0 var(--space-6) var(--space-6);
        }

        .post-body li { margin-bottom: var(--space-3); }

        .post-body img {
            width: 100%;
            border-radius: var(--radius-xl);
            margin: var(--space-8) 0;
            box-shadow: var(--shadow-lg);
        }

        .post-body blockquote {
            border-left: 4px solid var(--primary);
            padding: var(--space-4) var(--space-6);
            margin: var(--space-6) 0;
            background: var(--bg-secondary);
            border-radius: var(--radius-lg);
            font-style: italic;
        }

        .comments-section {
            margin-top: var(--space-12);
            padding-top: var(--space-8);
            border-top: 1px solid var(--border-primary);
        }

        .comments-title {
            font-size: var(--text-2xl);
            font-weight: 700;
            margin-bottom: var(--space-6);
        }

        .comment-form {
            background: var(--bg-secondary);
            padding: var(--space-6);
            border-radius: var(--radius-xl);
            margin-bottom: var(--space-8);
        }

        .form-group {
            margin-bottom: var(--space-4);
        }

        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: var(--space-2);
            font-size: var(--text-sm);
        }

        .form-group input, .form-group textarea {
            width: 100%;
            padding: var(--space-3) var(--space-4);
            border: 1px solid var(--border-primary);
            border-radius: var(--radius-md);
            background: var(--bg-primary);
            color: var(--text-primary);
            font-family: inherit;
            transition: all 0.2s ease;
        }

        .form-group input:focus, .form-group textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(0, 172, 193, 0.1);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 100px;
        }

        .submit-btn {
            width: 100%;
            padding: var(--space-3) var(--space-6);
            background: linear-gradient(135deg, var(--gradient-start), var(--gradient-mid));
            color: white;
            font-weight: 600;
            border-radius: var(--radius-lg);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }

        .comments-list {
            display: flex;
            flex-direction: column;
            gap: var(--space-6);
        }

        .comment {
            padding: var(--space-5);
            background: var(--bg-secondary);
            border-radius: var(--radius-lg);
            border-left: 3px solid var(--primary);
        }

        .comment-header {
            display: flex;
            align-items: center;
            gap: var(--space-3);
            margin-bottom: var(--space-3);
        }

        .comment-avatar {
            width: 36px;
            height: 36px;
            border-radius: var(--radius-full);
            background: linear-gradient(135deg, var(--gradient-start), var(--gradient-mid));
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 700;
            font-size: var(--text-xs);
        }

        .comment-meta {
            display: flex;
            flex-direction: column;
            gap: var(--space-1);
        }

        .comment-author {
            font-weight: 600;
            font-size: var(--text-sm);
        }

        .comment-date {
            font-size: var(--text-xs);
            color: var(--text-tertiary);
        }

        .comment-text {
            font-size: var(--text-sm);
            line-height: 1.6;
        }

        /* ========== SIDEBAR RIGHT ========== */
        .sidebar-right {
            position: sticky;
            top: var(--space-6);
            height: max-content;
            border-left: 1px solid var(--border-primary);
            padding-left: var(--space-6);
            max-height: calc(100vh - var(--space-12));
            overflow-y: auto;
        }

        .sidebar-right::-webkit-scrollbar { width: 6px; }
        .sidebar-right::-webkit-scrollbar-thumb { background: var(--gray-300); border-radius: 3px; }

        .share-section {
            margin-bottom: var(--space-10);
        }

        .share-title {
            font-size: var(--text-xs);
            font-weight: 700;
            text-transform: uppercase;
            color: var(--text-tertiary);
            margin-bottom: var(--space-3);
            letter-spacing: 0.5px;
        }

        .share-buttons {
            display: flex;
            gap: var(--space-1);
            flex-wrap: wrap;
        }

        .share-btn {
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            background: linear-gradient(145deg, #f7f7f8, #e9e9ea);
            border: 1px solid rgba(17,24,39,0.08);
            transition: all 0.2s ease;
            cursor: pointer;
            font-size: 16px;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.9), 0 10px 18px rgba(0,0,0,0.12);
        }

        .share-btn:hover {
            color: var(--primary);
            transform: translateY(-2px);
            box-shadow: 0 12px 22px rgba(0,0,0,0.18);
        }

        .sidebar-logo i,
        .sidebar-nav-item i,
        .post-meta-item i {
            width: 28px;
            height: 28px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            background: linear-gradient(145deg, #f7f7f8, #e9e9ea);
            border: 1px solid rgba(17,24,39,0.08);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.9), 0 8px 14px rgba(0,0,0,0.12);
        }

        .post-meta-item svg {
            width: 28px;
            height: 28px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 6px;
            border-radius: 10px;
            background: linear-gradient(145deg, #f7f7f8, #e9e9ea);
            border: 1px solid rgba(17,24,39,0.08);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.9), 0 8px 14px rgba(0,0,0,0.12);
            stroke: var(--primary);
            fill: none;
            flex-shrink: 0;
        }

        .related-section {
            margin-top: var(--space-10);
        }

        .related-title {
            font-size: var(--text-xs);
            font-weight: 700;
            text-transform: uppercase;
            color: var(--text-tertiary);
            margin-bottom: var(--space-4);
            letter-spacing: 0.5px;
        }

        .related-items {
            display: flex;
            flex-direction: column;
            gap: var(--space-4);
        }

        .related-item {
            display: flex;
            gap: var(--space-3);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .related-item:hover {
            opacity: 0.8;
            transform: translateX(4px);
        }

        .related-item-image {
            width: 80px;
            height: 80px;
            border-radius: var(--radius-lg);
            object-fit: cover;
            flex-shrink: 0;
            background: var(--bg-secondary);
        }

        .related-item-content {
            display: flex;
            flex-direction: column;
            gap: var(--space-1);
            min-width: 0;
        }

        .related-item-title {
            font-size: var(--text-sm);
            font-weight: 600;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .related-item-category {
            font-size: var(--text-xs);
            color: var(--text-tertiary);
            text-transform: capitalize;
        }

        /* ========== RESPONSIVE ========== */
        @media (max-width: 1400px) {
            body {
                grid-template-columns: 1fr;
                gap: var(--space-6);
            }

            .sidebar-left, .sidebar-right {
                display: none;
            }

            .content-main {
                max-width: 900px;
                margin: 0 auto;
            }
        }

        @media (max-width: 768px) {
            body {
                padding: var(--space-4);
            }

            .post-title {
                font-size: var(--text-2xl);
            }

            .post-hero-image {
                height: 250px;
            }

            .post-body {
                font-size: var(--text-base);
            }

            .post-body h2 {
                font-size: var(--text-2xl);
            }

            .share-buttons {
                gap: var(--space-1);
            }
        }

        /* Category color badges */
        .post-category-badge.design { color: #3b82f6; background: rgba(59, 130, 246, 0.1); }
        .post-category-badge.building { color: #f59e0b; background: rgba(245, 158, 11, 0.1); }
        .post-category-badge.construction { color: #ef4444; background: rgba(239, 68, 68, 0.1); }
        .post-category-badge.architecture { color: #8b5cf6; background: rgba(139, 92, 246, 0.1); }
        .post-category-badge.engineering { color: #10b981; background: rgba(16, 185, 129, 0.1); }
        .post-category-badge.materials { color: #ec4899; background: rgba(236, 72, 153, 0.1); }
    </style>
</head>
<body>
    <!-- LEFT SIDEBAR -->
    <aside class="sidebar-left">
        <div class="sidebar-logo">
            <i class='bx bx-news'></i>
            <span>TBPBlog</span>
        </div>

        <nav class="sidebar-nav">
            <div class="sidebar-nav-item active" onclick="navigateTo('dashboard')">
                <i class='bx bx-grid-alt'></i>
                <span>Dashboard</span>
            </div>
            <div class="sidebar-nav-item" onclick="navigateTo('articles')">
                <i class='bx bx-file-blank'></i>
                <span>Articles</span>
            </div>
            <div class="sidebar-nav-item" onclick="navigateTo('media')">
                <i class='bx bx-image'></i>
                <span>Media</span>
            </div>
        </nav>

        <div class="sidebar-section">
            <div class="sidebar-section-title">Categories</div>
            <div class="category-item" onclick="filterCategory('design')">🎨 Design</div>
            <div class="category-item" onclick="filterCategory('building')">🏢 Building</div>
            <div class="category-item" onclick="filterCategory('construction')">🔨 Construction</div>
            <div class="category-item" onclick="filterCategory('architecture')">🏛️ Architecture</div>
            <div class="category-item" onclick="filterCategory('engineering')">⚙️ Engineering</div>
            <div class="category-item" onclick="filterCategory('materials')">📦 Building Materials</div>
        </div>

        <div class="sidebar-section">
            <div class="sidebar-section-title">Settings</div>
            <div class="sidebar-nav-item" onclick="toggleTheme()">
                <i class='bx bx-moon'></i>
                <span>Theme</span>
            </div>
        </div>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="content-main">
        <div class="breadcrumb">
            <a href="blog.html">← Back to Homepage</a>
        </div>

        <div class="post-header">
            <div class="post-author-avatar" id="authorAvatarInitial">A</div>
            <div class="post-author-meta">
                <span class="post-author-name" id="postAuthor">Author Name</span>
                <span class="post-publish-date" id="postDate">June 24, 2025</span>
            </div>
        </div>

        <h1 class="post-title" id="postTitle">Post Title Goes Here</h1>

        <div class="post-meta-line">
            <span class="post-category-badge" id="postCategory">category</span>
            <span class="post-meta-item">
                <i class='bx bx-time'></i>
                <span id="postReadTime">5</span> min read
            </span>
            <span class="post-meta-item">
                <svg viewBox="0 0 24 24" aria-hidden="true" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                </svg>
                <span id="postViews">0</span> views
            </span>
        </div>

        <img id="postHeroImg" class="post-hero-image" alt="">

        <div class="post-body" id="postBody"></div>

        <!-- COMMENTS -->
        <div class="comments-section">
            <h2 class="comments-title">💬 Comments</h2>
            
            <form class="comment-form" onsubmit="submitComment(event)">
                <div class="form-group">
                    <label for="commentName">Name</label>
                    <input type="text" id="commentName" name="name" placeholder="Your name" required>
                </div>
                <div class="form-group">
                    <label for="commentEmail">Email</label>
                    <input type="email" id="commentEmail" name="email" placeholder="your@email.com" required>
                </div>
                <div class="form-group">
                    <label for="commentText">Comment</label>
                    <textarea id="commentText" name="text" placeholder="Share your thoughts..." required></textarea>
                </div>
                <button type="submit" class="submit-btn">Post Comment</button>
            </form>

            <div class="comments-list" id="commentsList"></div>
        </div>
    </main>

    <!-- RIGHT SIDEBAR -->
    <aside class="sidebar-right">
        <div class="share-section">
            <div class="share-title">Share</div>
            <div class="share-buttons">
                <button class="share-btn" title="Share on LinkedIn" onclick="shareTo('linkedin')">
                    <i class='bx bxl-linkedin'></i>
                </button>
                <button class="share-btn" title="Share on Twitter" onclick="shareTo('twitter')">
                    <i class='bx bxl-twitter'></i>
                </button>
                <button class="share-btn" title="Share on Facebook" onclick="shareTo('facebook')">
                    <i class='bx bxl-facebook'></i>
                </button>
                <button class="share-btn" title="Share on WhatsApp" onclick="shareTo('whatsapp')">
                    <i class='bx bxl-whatsapp'></i>
                </button>
                <button class="share-btn" title="Copy Link" onclick="copyLink()">
                    <i class='bx bx-link'></i>
                </button>
            </div>
        </div>

        <div class="related-section">
            <div class="related-title">Related Articles</div>
            <div class="related-items" id="relatedItems"></div>
        </div>
    </aside>

    <script src="../js/blog-data.js"></script>
    <script>
        // Navigation
        function navigateTo(section) {
            if (section === 'dashboard') {
                window.location.href = '../index.html';
            } else if (section === 'articles') {
                window.location.href = 'blog.html';
            } else if (section === 'media') {
                window.location.href = 'blog.html?view=media';
            }
        }

        // Theme Toggle
        function toggleTheme() {
            const html = document.documentElement;
            const current = html.getAttribute('data-theme');
            const next = current === 'light' ? 'dark' : 'light';
            html.setAttribute('data-theme', next);
            localStorage.setItem('theme-preference', next);
        }

        window.addEventListener('DOMContentLoaded', () => {
            const savedTheme = localStorage.getItem('theme-preference') || 'light';
            document.documentElement.setAttribute('data-theme', savedTheme);
            loadPost();
            loadComments();
        });

        async function loadPost() {
            const slug = new URLSearchParams(window.location.search).get('post');
            const post = typeof window.getBlogPostBySlug === 'function'
                ? await window.getBlogPostBySlug(slug)
                : (typeof blogPosts !== 'undefined' ? blogPosts.find(p => p.slug === slug) : null);

            if (!slug || !post) {
                document.body.innerHTML = '<div style="text-align: center; padding: 60px 20px;"><h1>Post not found</h1><a href="blog.html">← Return to Blog</a></div>';
                return;
            }

            document.getElementById('postHeroImg').src = post.image || 'https://via.placeholder.com/1200x600';
            document.getElementById('postTitle').textContent = post.title;
            document.getElementById('postCategory').textContent = post.category;
            document.getElementById('postCategory').className = `post-category-badge ${post.category.toLowerCase()}`;
            document.getElementById('postReadTime').textContent = post.readTime;
            document.getElementById('postViews').textContent = Number(post.views || 0).toLocaleString();
            document.getElementById('postAuthor').textContent = post.author;
            document.getElementById('postDate').textContent = new Date(post.date).toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
            
            const initials = post.author.split(' ').map(n => n[0]).join('').toUpperCase();
            document.getElementById('authorAvatarInitial').textContent = initials;

            document.getElementById('postBody').innerHTML = post.content || '<p>Content coming soon...</p>';
            document.title = `${post.title} | The Building Practice Ltd.`;

            loadRelated(slug, post.category);
        }

        function loadRelated(slug, category) {
            const related = blogPosts.filter(p => p.category === category && p.slug !== slug).slice(0, 5);
            
            const html = related.map(p => {
                const initials = p.author.split(' ').map(n => n[0]).join('').toUpperCase();
                return `
                    <a href="blog-single.html?post=${p.slug}" class="related-item">
                        <img src="${p.image || 'https://via.placeholder.com/80'}" alt="${p.title}" class="related-item-image">
                        <div class="related-item-content">
                            <div class="related-item-title">${p.title}</div>
                            <div class="related-item-category">${p.category}</div>
                        </div>
                    </a>
                `;
            }).join('');

            document.getElementById('relatedItems').innerHTML = html || '<p style="font-size: 12px; color: var(--text-tertiary);">No related articles</p>';
        }

        function shareTo(platform) {
            const url = window.location.href;
            const title = document.getElementById('postTitle').textContent;
            const text = title + ' - Read more on The Building Practice Blog';
            
            if (platform === 'linkedin') {
                window.open(`https://www.linkedin.com/sharing/share-offsite/?url=${encodeURIComponent(url)}`);
            } else if (platform === 'twitter') {
                window.open(`https://twitter.com/intent/tweet?text=${encodeURIComponent(title)}&url=${encodeURIComponent(url)}`);
            } else if (platform === 'facebook') {
                window.open(`https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(url)}`);
            } else if (platform === 'whatsapp') {
                window.open(`https://wa.me/?text=${encodeURIComponent(text + ' ' + url)}`);
            }
        }

        function copyLink() {
            const url = window.location.href;
            navigator.clipboard.writeText(url).then(() => {
                alert('Link copied to clipboard!');
            }).catch(() => {
                alert('Failed to copy link');
            });
        }

        function filterCategory(category) {
            window.location.href = `blog.html?category=${category}`;
        }

        function loadComments() {
            const slug = new URLSearchParams(window.location.search).get('post');
            const comments = JSON.parse(localStorage.getItem(`comments_${slug}`) || '[]');
            
            if (comments.length === 0) {
                document.getElementById('commentsList').innerHTML = '<p style="text-align: center; color: var(--text-tertiary); padding: 40px 0;">No comments yet. Be the first to comment!</p>';
                return;
            }

            const html = comments.map(c => {
                const initials = c.author.split(' ').map(n => n[0]).join('').toUpperCase();
                return `
                    <div class="comment">
                        <div class="comment-header">
                            <div class="comment-avatar">${initials}</div>
                            <div class="comment-meta">
                                <span class="comment-author">${c.author}</span>
                                <span class="comment-date">${new Date(c.date).toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' })}</span>
                            </div>
                        </div>
                        <p class="comment-text">${c.text}</p>
                    </div>
                `;
            }).join('');

            document.getElementById('commentsList').innerHTML = html;
        }

        function submitComment(event) {
            event.preventDefault();
            const slug = new URLSearchParams(window.location.search).get('post');
            const form = new FormData(event.target);
            
            const comment = {
                author: form.get('name'),
                email: form.get('email'),
                text: form.get('text'),
                date: new Date().toISOString()
            };

            const comments = JSON.parse(localStorage.getItem(`comments_${slug}`) || '[]');
            comments.unshift(comment);
            localStorage.setItem(`comments_${slug}`, JSON.stringify(comments));

            event.target.reset();
            loadComments();
        }
    </script>
  <script src="../js/theme-sync.js" defer></script>
</body>
</html>
