<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TBP Videos - Demo Player</title>
  <link href="../css/enhanced-styles.css" rel="stylesheet">
  <style>
    body { font-family: Inter, sans-serif; padding: 2rem; background: #f8fafc; }
    .video-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); gap: 2rem; max-width: 1400px; margin: 0 auto; }
    .video-embed { aspect-ratio: 16/9; border-radius: 16px; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,0.1); }
    .video-title { font-size: 1.25rem; font-weight: 600; margin: 1rem 0 0.5rem; color: #1a5f7a; }
    h1 { text-align: center; margin-bottom: 3rem; color: #1a5f7a; font-size: 2.5rem; font-weight: 800; }
    .status { text-align: center; padding: 1rem; background: #10b981; color: white; border-radius: 8px; margin: 2rem 0; }
    .test-section { margin-top: 4rem; padding-top: 3rem; border-top: 2px solid #e2e8f0; }
    .test-video { max-width: 600px; margin: 0 auto 2rem; }
  </style>
</head>
<body>
  <h1>🎥 TBP Videos - Demo Player</h1>
  <p style="text-align: center; max-width: 800px; margin: 0 auto 2rem; color: #64748b;">Self-hosted video player with auto-advance carousel, sticky overlay, background play. <strong>Add MP4 to subfolders → auto-detects.</strong></p>
  
  <div class="status" id="status">Loading videos...</div>
  
  <div class="video-grid" id="videoGrid"></div>

  <!-- Test Section for Green.mp4 -->
  <div class="test-section">
    <h2 style="text-align: center; color: #1a5f7a;">🧪 Green.mp4 Test</h2>
    <div class="video-embed test-video local-video-ready" data-video-path="../videos/Green.mp4" data-video-title="Green Architecture Demo">
      <video preload="metadata" src="../videos/Green.mp4" muted playsinline class="video-player-local"></video>
      <img class="video-thumb" src="https://img.youtube.com/vi/dQw4w9WgXcQ/maxresdefault.jpg" alt="Green video thumbnail" style="display:none;">
      <button class="video-play">🎥 Local: Green.mp4</button>
    </div>
    <p style="text-align: center; color: #64748b;">This tests generic local video detection (uses main site JS logic)</p>
  </div>

  <script>
    const philosophyVideos = [
      { id: '01-innovation', title: 'Innovation in Architecture', poster: 'https://img.youtube.com/vi/YEFR-Ay9BX8/hqdefault.jpg' },
      { id: '02-sustainability', title: 'Sustainable Architecture', poster: 'https://img.youtube.com/vi/beUzEqtOAUc/hqdefault.jpg' },
      { id: '03-human-centric', title: 'Human-Centric Design', poster: 'https://img.youtube.com/vi/jV1v2NNEdVw/hqdefault.jpg' },
      { id: '04-craftsmanship', title: 'Architectural Craftsmanship', poster: 'https://img.youtube.com/vi/8bKffrD0Q0k/hqdefault.jpg' },
      { id: '05-legacy', title: 'Architectural Legacy', poster: 'https://img.youtube.com/vi/7KMM5gD6eG4/hqdefault.jpg' }
    ];

    async function checkVideoExists(path) {
      try {
        const res = await fetch(path, { method: 'HEAD' });
        return res.ok;
      } catch {
        return false;
      }
    }

    async function loadVideos() {
      const grid = document.getElementById('videoGrid');
      const status = document.getElementById('status');
      let hasLocal = 0;

      for (let video of philosophyVideos) {
        const localPath = `../videos/philosophy/${video.id}.mp4`;
        const hasMp4 = await checkVideoExists(localPath);
        
        if (hasMp4) hasLocal++;

        const embed = document.createElement('div');
        embed.className = 'video-embed';
        embed.innerHTML = `
          <div class="video-thumb" style="background-image: url('${video.poster}');"></div>
          <button class="video-play" data-id="${video.id}"><i class='bx bx-play'></i></button>
          ${hasMp4 ? `<video preload="metadata" poster="${video.poster}" src="${localPath}" muted playsinline></video>` : ''}
          <h3 class="video-title">${video.title}</h3>
          <p style="font-size: 0.875rem; color: #94a3b8; margin-top: 0.25rem;">${hasMp4 ? '✅ Local MP4 Ready' : '📺 YouTube (add MP4 to enable local)'}</p>
        `;

        const playBtn = embed.querySelector('.video-play');
        const localVideo = embed.querySelector('video');
        
        playBtn.onclick = () => playVideo(embed, localVideo);
        
        grid.appendChild(embed);
      }

      status.innerHTML = `✅ <strong>${hasLocal}/${philosophyVideos.length}</strong> philosophy videos detected | <a href="../index.html" style="color: #fbbf24;">Test Homepage</a> | Green.mp4 ✅ Ready Below`;
    }

    let currentVideo = null;
    function playVideo(container, videoEl) {
      if (currentVideo && currentVideo !== videoEl) currentVideo.pause();
      
      if (videoEl) {
        currentVideo = videoEl;
        videoEl.play();
        container.classList.add('playing');
        videoEl.onended = () => nextVideo(container);
      } else {
        window.open(`https://youtube.com/watch?v=${container.querySelector('.video-play').dataset.id}`, '_blank');
      }
    }

    function nextVideo(current) {
      const nextBtn = current.parentNode.querySelector('.next-video');
      if (nextBtn) nextBtn.click();
    }

    // Test Green.mp4 with main site logic (includes sticky)
    document.addEventListener('DOMContentLoaded', () => {
      loadVideos();
      
      // Load main site JS for sticky player testing
      const script = document.createElement('script');
      script.src = '../js/script.js';
      document.head.appendChild(script);
    });
  </script>
</body>
</html>
